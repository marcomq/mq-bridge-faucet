name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  plugin-conformance:
    name: Endpoint tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify package versions
        run: python3 scripts/set_version.py --check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Same system packages faucet-stream's own CI installs (sasl2-sys, rdkafka, openssl).
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential

      - name: Endpoint behaviour, linked and plugin-loaded
        run: cargo test

  # Release packages build with `full`; this catches a broken feature set
  # before a tag does.
  full-features:
    name: Full connector set builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-full-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-full-

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential

      - name: Check with every connector
        run: cargo check --features full

  schema-registry:
    name: Kafka Avro with schema registry
    runs-on: ubuntu-latest
    env:
      FAUCET_TEST_KAFKA_BROKERS: localhost:9092
      FAUCET_TEST_SCHEMA_REGISTRY: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Redpanda serves Kafka and a Confluent-compatible schema registry in one container.
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 9092:9092 -p 8081:8081 \
            redpandadata/redpanda:v24.2.7 redpanda start --mode dev-container --smp 1 \
            --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr localhost:9092 \
            --schema-registry-addr 0.0.0.0:8081

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-sr-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential

      - name: Build the test
        run: cargo test --features faucet-cli/kafka-schema-registry --test kafka_schema_registry --no-run

      - name: Wait for the schema registry
        run: |
          for _ in $(seq 60); do curl -sf localhost:8081/subjects && exit 0; sleep 2; done
          docker logs redpanda; exit 1

      - name: Avro round trip through the registry
        run: cargo test --features faucet-cli/kafka-schema-registry --test kafka_schema_registry -- --ignored

  node-package:
    name: Node package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: node
        run: npm install --no-package-lock

      - name: Run tests
        working-directory: node
        run: npm test
