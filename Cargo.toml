[package]
name = "mq-bridge-faucet"
version = "0.2.0"
edition = "2021"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
description = "faucet-stream connectors as an mq-bridge endpoint"
repository = "https://github.com/marcomq/mq-bridge-faucet"
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[lib]
# `rlib` for Rust users who link the endpoint directly; `cdylib` is the loadable
# plugin the Python and npm packages ship and `load_endpoint_plugin` opens.
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
mq-bridge = { version = ">=1.1, <2", default-features = false }
# The by-name connector registry, semver-checked (faucet-hq/faucet-stream#995).
faucet-registry = { version = "1.0", default-features = false }
faucet-core = { version = "1.14.1", features = ["masking", "quality", "contract"] }
futures = "0.3"
# Derives the configuration schema from the config struct, so the two cannot drift.
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.34", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
mq-bridge = { version = ">=1.1, <2", default-features = false, features = ["plugin-sdk", "test-utils"] }
tempfile = "3"
tokio = { version = "1.34", features = ["rt-multi-thread", "macros"] }

[features]
# The plugin export is on by default: it is what the Python and npm packages
# load. Turn it off (`default-features = false`) when linking this crate
# directly alongside another plugin, since both would define the same
# `mq_bridge_plugin_v1` symbol.
default = ["plugin", "connectors"]
plugin = ["mq-bridge/plugin-sdk"]
# Every faucet source and sink. Without it, pick connectors one by one, e.g.
# `--no-default-features --features plugin,faucet-registry/source-rest`.
connectors = [
    "faucet-registry/source",
    "faucet-registry/sink",
    "faucet-registry/compression",
    "faucet-registry/file-format-csv",
    "faucet-registry/file-format-parquet",
    "faucet-registry/google-sa",
]
# Endpoint parity with faucet's prebuilt `full` binaries, minus its CLI and
# server features. Release packages build with this; local builds stay slim.
full = [
    "connectors",
    "faucet-registry/kafka-schema-registry",
    "faucet-registry/source-oracle",
    "faucet-registry/source-oracle-cdc",
    "faucet-registry/sink-oracle",
    "faucet-registry/delta-s3",
    "faucet-registry/delta-azure",
    "faucet-registry/delta-gcs",
    "faucet-registry/source-iceberg-glue",
    "faucet-registry/source-iceberg-hms",
    "faucet-registry/source-iceberg-sql",
    "faucet-registry/source-rest-excel",
    "faucet-registry/source-xml-excel",
    "faucet-registry/sink-clickhouse-staging",
    "faucet-registry/sink-mssql-staging",
    "faucet-registry/sink-databricks-staging",
    "faucet-registry/file-formats",
    "faucet-registry/arrow",
    "faucet-registry/mtls",
    "faucet-registry/rabbitmq-tls",
    "faucet-registry/oauth1",
    "faucet-registry/encryption",
    "faucet-core/quality-jsonschema",
]

[profile.release]
strip = true
